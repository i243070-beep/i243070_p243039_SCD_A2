# chroma: the vector store. A StatefulSet, not a Deployment: one replica with a stable network identity
# and its own PersistentVolumeClaim (volumeClaimTemplates) that survives pod restarts and rescheduling. A
# Deployment would give a rolling update two pods fighting over one volume; see docs/ARCHITECTURE.md.
# Written to only by the indexer Job; the api reads. Server version == the chromadb-client pin (1.0.12).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
  labels:
    app.kubernetes.io/name: chroma
    app.kubernetes.io/part-of: rahbar
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chroma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chroma
        app.kubernetes.io/part-of: rahbar
    spec:
      serviceAccountName: chroma
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000            # makes the PVC writable by the non-root user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12
          imagePullPolicy: IfNotPresent
          args: ["run", "--path", "/data", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: { path: /api/v2/heartbeat, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /api/v2/heartbeat, port: 8000 }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/v2/heartbeat, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m   # kubectl top: 3m idle, 44m under load
              memory: 128Mi   # kubectl top: 73-80Mi with the 1,120-chunk index
            limits:
              cpu: 500m
              memory: 256Mi   # 3.2x the observed 80Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: chroma-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: chroma-data        # the PVC named in the architecture diagram: chroma-data-chroma-0
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: rahbar
  labels:
    app.kubernetes.io/name: chroma
spec:
  type: ClusterIP              # the data tier is never NodePort or LoadBalancer
  selector:
    app.kubernetes.io/name: chroma
  ports:
    - name: http
      port: 8000
      targetPort: http
