# One ServiceAccount per workload (section 4.7: "everything is admin" closed).
# None of these programs calls the Kubernetes API, so no API token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chroma
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: indexer
  namespace: rahbar
automountServiceAccountToken: false
