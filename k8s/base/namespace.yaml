# Everything lives in the `rahbar` namespace, never `default` (section 4).
apiVersion: v1
kind: Namespace
metadata:
  name: rahbar
  labels:
    app.kubernetes.io/part-of: rahbar
    # Pod Security Admission: reject pods that run privileged; warn when they miss the restricted profile.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
