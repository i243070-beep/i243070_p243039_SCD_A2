# PLACEHOLDER ONLY. This file documents the shape of the Secret. It holds no real value and is
# deliberately NOT listed in kustomization.yaml: applying it would overwrite the real Secret.
#
# Create the real Secret from the command line (never from a file), after `export LLM_API_KEY=...`:
#   make secret
# which runs:
#   kubectl create secret generic rahbar-secret -n rahbar \
#     --from-literal=LLM_API_KEY="$LLM_API_KEY" --dry-run=client -o yaml | kubectl apply -f -
#
# Base64 is encoding, not encryption: never commit a real value here.
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
