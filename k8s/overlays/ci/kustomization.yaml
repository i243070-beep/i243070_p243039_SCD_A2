# ci overlay: used by GitHub Actions (e2e-eval and the deploy smoke test). It indexes the tiny fixture
# corpus instead of the real one, so CI runs in minutes. The workflow first runs:
#   kubectl create configmap rahbar-fixtures --from-file=eval/fixtures -n rahbar
# and this overlay mounts that ConfigMap over /corpus in the indexer Job (the same image, a different corpus).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Job
      name: indexer
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: corpus
          configMap:
            name: rahbar-fixtures
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: corpus
          mountPath: /corpus
          readOnly: true
  - target:
      kind: CronJob
      name: reindex
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes/-
        value:
          name: corpus
          configMap:
            name: rahbar-fixtures
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts/-
        value:
          name: corpus
          mountPath: /corpus
          readOnly: true
  # DEMO (assignment 6, 'show the gate working'): TOP_K=0 is a plausible slip. Chroma rejects n_results=0, the API falls back safely
  # (no 500) with nothing retrieved, so recall@5 is 0 and the e2e-eval gate must turn this pull request red.
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      - op: replace
        path: /data/TOP_K
        value: "0"
images:
  - name: samullah/rahbar-api
    newTag: ci
  - name: samullah/rahbar-indexer
    newTag: ci
  - name: samullah/rahbar-ui
    newTag: ci
