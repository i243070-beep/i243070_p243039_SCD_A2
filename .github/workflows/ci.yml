# CI: runs on a pull request to main and on a push to dev (section 6).
# lint, test and manifests run first; build, scan and the end-to-end evaluation are gated behind them with needs:.
# Nothing here publishes an image. Credentials: none are needed (generation uses Ollama on the runner).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  KUSTOMIZE_VERSION: "5.4.3"
  KUBECONFORM_VERSION: "0.6.7"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements-dev.txt
            indexer/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: ruff
        run: ruff check api indexer eval corpus
      - name: mypy (api)
        run: cd api && mypy app
      - name: mypy (indexer)
        run: cd indexer && mypy pipeline

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements-dev.txt
            indexer/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: api tests (stub provider, no network, no model; coverage of the app package at least 60 percent)
        run: cd api && pytest --cov=app --cov-fail-under=60
      - name: indexer tests
        run: cd indexer && pytest
      - name: eval tests
        run: pytest eval/tests

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kustomize and kubeconform
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o /tmp/kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          sudo tar xzf /tmp/kustomize.tgz -C /usr/local/bin kustomize
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o /tmp/kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          sudo tar xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform
      - name: kustomize build | kubeconform (a broken manifest fails here in seconds, not on the cluster)
        run: |
          set -euo pipefail
          for overlay in dev prod ci; do
            echo "== overlay: $overlay"
            kustomize build "k8s/overlays/$overlay" | kubeconform -strict -summary -ignore-missing-schemas
          done

  build:
    # Only build images from code that already passed lint and tests. Never pushes: this is CI.
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, indexer, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: false
          tags: samullah/rahbar-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  scan:
    # Trivy: HIGH or CRITICAL findings that have a fix available fail the job.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, indexer, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          load: true
          push: false
          tags: scan/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Trivy scan (HIGH and CRITICAL findings that have a fix fail the job)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image             --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table             scan/${{ matrix.image }}:${{ github.sha }}

  e2e-eval:
    # The most valuable job: a real cluster, the real indexer Job on the small fixture corpus, the real api,
    # then the evaluation gate (recall@5 within 5 points of the baseline, every must-abstain declined,
    # citation validity at least 95 percent).
    needs: [test, build, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install httpx pyyaml

      - name: install Ollama on the runner and pull the pinned models
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o /tmp/ollama-install.sh https://ollama.com/install.sh \
               && OLLAMA_VERSION=0.40.15 sh /tmp/ollama-install.sh; then break; fi
            echo "Ollama install attempt $attempt failed; retrying in 30s"; sleep 30
            [ "$attempt" = 5 ] && exit 1
          done
          sudo systemctl stop ollama || true
          OLLAMA_HOST=0.0.0.0:11434 nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          for i in 1 2 3 4 5; do ollama pull nomic-embed-text && break; sleep 20; done
          for i in 1 2 3 4 5; do ollama pull llama3.2:3b && break; sleep 20; done

      - name: create a kind cluster
        run: |
          set -euo pipefail
          for url in https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64 \
               https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64; do
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 10 -o /tmp/kind "$url" && break
          done
          test -s /tmp/kind
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version
          kind create cluster --name rahbar --config .github/kind-config.yaml --wait 120s

      - name: build the images and load them into kind
        run: |
          set -euo pipefail
          for name in api indexer ui; do
            docker build -t "samullah/rahbar-$name:ci" "$name"
            kind load docker-image "samullah/rahbar-$name:ci" --name rahbar
          done

      - name: deploy the ci overlay (fixture corpus) and point the pods at the runner's Ollama
        run: |
          set -euo pipefail
          GATEWAY=$(docker network inspect kind | jq -r '.[0].IPAM.Config[] | select(.Gateway | test("^[0-9.]+$")) | .Gateway' | head -1)
          echo "Ollama on the runner is reachable from the pods at $GATEWAY"
          kubectl create namespace rahbar
          kubectl -n rahbar create configmap rahbar-fixtures --from-file=eval/fixtures
          kubectl kustomize k8s/overlays/ci | sed "s/192.168.65.254/${GATEWAY}/g" | kubectl apply -f -
          kubectl -n rahbar patch configmap rahbar-config --type merge \
            -p "{\"data\":{\"OLLAMA_URL\":\"http://${GATEWAY}:11434\",\"LLM_TIMEOUT\":\"240\"}}"
          kubectl -n rahbar rollout restart deployment/api

      - name: wait for the indexer Job and the rollouts
        run: |
          set -euo pipefail
          kubectl -n rahbar wait --for=condition=complete job/indexer --timeout=900s
          kubectl -n rahbar rollout status statefulset/chroma --timeout=300s
          kubectl -n rahbar rollout status deployment/redis --timeout=300s
          kubectl -n rahbar rollout status deployment/api --timeout=600s

      - name: evaluate the fixture golden set and enforce the gate
        run: |
          set -euo pipefail
          kubectl -n rahbar port-forward svc/api 8000:8000 &
          sleep 5
          BASELINE=eval/fixtures/baseline.fixture.json
          python eval/run_eval.py --api http://127.0.0.1:8000 \
            --golden eval/fixtures/golden.fixture.yaml --baseline "$BASELINE" \
            --out eval/results.fixture.json

      - name: evidence on failure (pods, events, logs)
        if: always()
        run: |
          kubectl -n rahbar get pods -o wide || true
          kubectl -n rahbar get events --sort-by=.lastTimestamp | tail -25 || true
          kubectl -n rahbar logs job/indexer --tail=40 || true
          kubectl -n rahbar logs deployment/api --tail=60 || true
          tail -20 "$RUNNER_TEMP/ollama.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-fixture
          path: eval/results.fixture.json
          if-no-files-found: ignore
